name: Reusable CI (Test & Lint Gate)
on:
  workflow_call:
    inputs:
      working-directory: { required: false, type: string, default: '.' }
      python-version: { required: false, type: string, default: '3.11' }
      node-version: { required: false, type: string, default: '20' }
jobs:
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - id: stack
        run: |
          if [ -f "requirements.txt" ] || [ -f "pyproject.toml" ]; then echo "python=true" >> $GITHUB_OUTPUT; fi
          if [ -f "package.json" ]; then echo "node=true" >> $GITHUB_OUTPUT; fi
      - if: steps.stack.outputs.python == 'true'
        uses: actions/setup-python@v5
        with: { python-version: '${{ inputs.python-version }}', cache: 'pip' }
      - if: steps.stack.outputs.python == 'true'
        run: |
          pip install ruff pytest
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi
          ruff check .
          if ls test_*.py *_test.py tests/ >/dev/null 2>&1; then pytest; fi
      - if: steps.stack.outputs.node == 'true'
        uses: actions/setup-node@v4
        with: { node-version: '${{ inputs.node-version }}', cache: 'npm' }
      - if: steps.stack.outputs.node == 'true'
        run: |
          if [ -f "package-lock.json" ]; then npm ci; else npm install; fi
          npm run lint --if-present
          npm test --if-present -- --watchAll=false
